[project]
name = "pulse"
version = "0.1.0"
description = "A CLI for monitoring HTTP endpoints."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
    "typer>=0.15.0",
]

[project.scripts]
pulse = "pulse.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
